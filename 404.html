<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="refresh" content="0; url=/">
    <title>URBAN — Одяг та куртки</title>
    <script>
        window.location.replace('/');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #0f172a;
        }
        .redirect-card {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e2e8f0;
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-title {
            font-size: 16px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .status-sub {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .btn-home {
            display: inline-block;
            padding: 10px 22px;
            background: #0f172a;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-home:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <div class="status-title">Завантаження каталогу URBAN...</div>
        <div class="status-sub">Перенаправляємо вас до магазину</div>
        <a href="/" class="btn-home">Перейти зараз</a>
    </div>
    <script>
        window.location.replace('/');
    </script>
</body>
</html>
