<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="refresh" content="0; url=/">
  <title>WarmHome UA — Перенаправлення</title>
  <script>
    window.location.replace('/');
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0B0F17;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      text-align: center;
      max-width: 420px;
      width: 100%;
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .flame-icon {
      font-size: 40px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #F8FAFC;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 14px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #EA580C;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #C2410C;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="flame-icon">🔥</div>
    <h1 class="title">WarmHome UA</h1>
    <p class="sub">Переходимо на головну сторінку магазину...</p>
    <a href="/" class="btn">На головну</a>
  </div>
</body>
</html>
